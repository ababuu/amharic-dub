# ---------------------------------------------------------------------------
# rclone config for the Google Drive remote
# ---------------------------------------------------------------------------
# This is a TEMPLATE. The real file holds an OAuth refresh token, so it is a
# credential and is never committed: copy it to a path outside the repository
# (for example /workspace/rclone.conf) and fill it in with `rclone config`.
#
# You do not normally type the token by hand. Create it once on a machine with a
# browser, then copy the resulting file to the worker:
#
#   # on your PC
#   rclone config            # n -> name: gdrive -> 19 (Google Drive)
#                            # client_id/secret: blank -> scope: 3 (full access)
#                            # headless machine: no -> auto config: yes -> keep: yes
#
#   # copy it to the volume (do not paste it into a chat or a commit)
#   scp ~/.config/rclone/rclone.conf root@POD_HOST:/workspace/rclone.conf
#
# If you prefer to configure on the pod itself, run `rclone authorize "drive"` on a
# machine with a browser and paste the token it prints into `rclone config`.
#
# Then point the pipeline at it (Pod environment variables, or .env):
#   RCLONE_CONFIG=/workspace/rclone.conf
#   DRIVE_REMOTE=gdrive
#   DRIVE_SOURCE_FOLDER=amharic-dub/input          # where the episodes live
#   DRIVE_OUTPUT_FOLDER=amharic-dub/output         # where the dubs go
#
# Verify with: python scripts/drive_sync.py status
#
# ---------------------------------------------------------------------------
# Option B: no config file at all - set the remote as environment variables
# ---------------------------------------------------------------------------
# rclone reads a remote's settings from RCLONE_CONFIG_<NAME>_<KEY>, so the token can
# live in the pod's environment next to HUGGINGFACE_TOKEN. This is the same exposure
# as a .env file and needs nothing copied to the volume. Use it instead of
# RCLONE_CONFIG, not as well as it: a config *path* that does not exist makes rclone
# fail before it reads the variables.
#
# Get the token once, on a machine with a browser:
#
#   rclone authorize "drive"        # approve in the browser, copy the JSON it prints
#
# Then add these three pod environment variables (the token must stay on one line,
# with its quotes exactly as printed):
#
#   RCLONE_CONFIG_GDRIVE_TYPE=drive
#   RCLONE_CONFIG_GDRIVE_SCOPE=drive
#   RCLONE_CONFIG_GDRIVE_TOKEN={"access_token":"...","token_type":"Bearer","refresh_token":"...","expiry":"2026-10-28T20:00:00.000000000Z"}
#
# DRIVE_REMOTE must still be `gdrive`, because that is the name in the variables.
# `python scripts/drive_sync.py status` prints which source it is using.
#
# If you would rather build the whole remote definition by hand, quoting the JSON in
# a shell is the only fiddly part:
#
#   export RCLONE_CONFIG_GDRIVE_TOKEN='{"access_token":"x","token_type":"Bearer","refresh_token":"y","expiry":"2026-10-28T20:00:00Z"}'
#
# Do not paste the token into a commit, an issue or a chat message.
#
# ---------------------------------------------------------------------------
# Quoting the token is the one fiddly part
# ---------------------------------------------------------------------------
# The token is a JSON object. If its outer braces or the quotes around its keys are
# removed before rclone sees it - which is what happens when the value is pasted
# without quotes into a shell or a template field - rclone reports
#
#   invalid character 'a' looking for beginning of object key string
#
# which names neither the variable nor the cause. Give the value as one line wrapped
# in single quotes, so the braces and inner double quotes are passed through intact:
#
#   export RCLONE_CONFIG_GDRIVE_TOKEN='{"access_token":"x","token_type":"Bearer","refresh_token":"y","expiry":"2026-10-28T20:00:00Z"}'
#
# If the value arrives damaged anyway, the pipeline names the variable and the likely
# cause instead of passing rclone's message through:
#   python scripts/drive_sync.py status
#
# ---------------------------------------------------------------------------
# Service-account alternative
# ---------------------------------------------------------------------------
# For a Shared Drive, a service account avoids the browser entirely: create one in
# Google Cloud, download its JSON key to the worker, share the Drive folder with the
# service account's address, and use
#
#   [gdrive]
#   type = drive
#   scope = drive
#   service_account_file = /workspace/service-account.json
#   team_drive = <shared drive id>          # only for a Shared Drive
#
# ---------------------------------------------------------------------------
# What `rclone config` writes, with the token to replace
# ---------------------------------------------------------------------------

[gdrive]
type = drive
scope = drive
token = {"access_token":"REPLACE_ME","token_type":"Bearer","refresh_token":"REPLACE_ME","expiry":"2000-01-01T00:00:00Z"}
team_drive =
chunk_size = 64M

# The remote name in brackets is what DRIVE_REMOTE must contain. Anything after
# this line is rclone's own storage, not transfer tuning.
